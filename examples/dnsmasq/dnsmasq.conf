# dnsmasq Configuration for LLM Discovery
# Lightweight DNS for local development and testing

# =============================================================================
# LISTENING CONFIGURATION
# =============================================================================

# Listen on localhost only (safe for development)
listen-address=127.0.0.1

# Use non-standard port to avoid conflicts with system DNS
# Change to 53 if you want to use as primary DNS
port=5353

# Bind to specific interfaces (optional)
# interface=lo

# Don't bind to wildcard address
bind-interfaces

# =============================================================================
# UPSTREAM DNS (Optional)
# =============================================================================

# Don't read /etc/resolv.conf for upstream servers
no-resolv

# Uncomment to forward unknown queries to Google DNS
# server=8.8.8.8
# server=8.8.4.4

# Or use Cloudflare
# server=1.1.1.1
# server=1.0.0.1

# =============================================================================
# LOCAL RESOLUTION
# =============================================================================

# Don't read /etc/hosts
# (We define our own hosts below)
no-hosts

# Domain for local development
domain=dev.local
local=/dev.local/

# Expand simple names with domain
expand-hosts

# =============================================================================
# LOGGING
# =============================================================================

# Log all DNS queries
log-queries

# Log to specific file (or comment out to use syslog)
# log-facility=/var/log/dnsmasq.log

# Log async DNS queries
log-async

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================

# Cache size (number of entries)
cache-size=1000

# Don't cache negative results as long
# (useful for development when services come and go)
neg-ttl=60

# Local TTL for our records
local-ttl=60

# =============================================================================
# SECURITY
# =============================================================================

# Don't forward private IP ranges
bogus-priv

# Filter private IP ranges from upstream
stop-dns-rebind

# Except for our local ranges
rebind-localhost-ok
rebind-domain-ok=dev.local
rebind-domain-ok=corp.local

# =============================================================================
# INCLUDE ADDITIONAL CONFIGURATIONS
# =============================================================================

# Include the LLM discovery records (SRV/TXT) that live next to this file.
#
# NOTE: the path is resolved relative to the directory dnsmasq is started
# from, so start dnsmasq from this directory:
#   cd examples/dnsmasq && dnsmasq -C dnsmasq.conf --no-daemon
#
# For a system-wide install, copy llm-discovery.conf to /etc/dnsmasq.d/
# and use this instead:
#   conf-dir=/etc/dnsmasq.d/,*.conf
conf-file=llm-discovery.conf

# =============================================================================
# LOCALHOST ALIASES
# =============================================================================

# Map localhost variations
address=/localhost/127.0.0.1
address=/localhost/::1

# =============================================================================
# DEVELOPMENT ENDPOINTS
# =============================================================================

# Mock LLM servers running locally
address=/llm-mock.dev.local/127.0.0.1
address=/embeddings-mock.dev.local/127.0.0.1
address=/vision-mock.dev.local/127.0.0.1

# Internal test endpoints (if you have VMs or containers)
# address=/llm-test.dev.local/192.168.1.100

# =============================================================================
# ADVANCED OPTIONS
# =============================================================================

# Enable DNSSEC validation (optional)
# dnssec
# trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

# Disable daemon mode for debugging
# no-daemon

# Number of queries to cache
# max-cache-ttl=3600

# Read ethers file for static DHCP (not needed for DNS-only)
# no-dhcp-interface=

# =============================================================================
# NOTES
# =============================================================================
#
# To start dnsmasq:
#   sudo systemctl start dnsmasq
#
# To run in foreground for testing:
#   dnsmasq -C dnsmasq.conf --no-daemon --log-queries
#
# To test configuration:
#   dnsmasq --test -C dnsmasq.conf
#
# To query:
#   dig @localhost -p 5353 SRV _llm-chat._tcp.dev.local
#
# To reload configuration:
#   sudo killall -HUP dnsmasq
