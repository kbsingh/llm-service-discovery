# LLM Discovery SRV Records for dnsmasq
# Place in /etc/dnsmasq.d/ or include from main dnsmasq.conf

# =============================================================================
# SRV RECORD FORMAT
# srv-host=<service>.<protocol>.<domain>,<target>,<port>,<priority>,<weight>
# =============================================================================

# =============================================================================
# CHAT COMPLETION ENDPOINTS
# =============================================================================

# Primary: Local mock server for development
srv-host=_llm-chat._tcp.dev.local,localhost,3000,10,70

# Secondary: Shared development server (if you have one)
# srv-host=_llm-chat._tcp.dev.local,dev-llm.dev.local,8080,10,30

# Fallback: Public API (for integration testing)
# srv-host=_llm-chat._tcp.dev.local,api.dev.local,443,20,100

# Metadata via TXT records
txt-record=_llm-chat._tcp.dev.local,"path=/v1/messages"
txt-record=_llm-chat._tcp.dev.local,"provider=mock"
txt-record=_llm-chat._tcp.dev.local,"protocol=openai-compatible"
txt-record=_llm-chat._tcp.dev.local,"environment=development"
txt-record=_llm-chat._tcp.dev.local,"auth=optional"
txt-record=_llm-chat._tcp.dev.local,"cost=free"

# =============================================================================
# EMBEDDING ENDPOINTS
# =============================================================================

srv-host=_llm-embedding._tcp.dev.local,localhost,3001,10,100

txt-record=_llm-embedding._tcp.dev.local,"path=/v1/embeddings"
txt-record=_llm-embedding._tcp.dev.local,"provider=mock"
txt-record=_llm-embedding._tcp.dev.local,"model=mock-embedding"
txt-record=_llm-embedding._tcp.dev.local,"dimensions=384"
txt-record=_llm-embedding._tcp.dev.local,"environment=development"

# =============================================================================
# VISION (MULTIMODAL) ENDPOINTS
# =============================================================================

srv-host=_llm-vision._tcp.dev.local,localhost,3002,10,100

txt-record=_llm-vision._tcp.dev.local,"path=/v1/messages"
txt-record=_llm-vision._tcp.dev.local,"provider=mock"
txt-record=_llm-vision._tcp.dev.local,"capabilities=image-understanding"
txt-record=_llm-vision._tcp.dev.local,"environment=development"

# =============================================================================
# CODE-SPECIALIZED ENDPOINTS
# =============================================================================

srv-host=_llm-code._tcp.dev.local,localhost,3003,10,100

txt-record=_llm-code._tcp.dev.local,"path=/v1/completions"
txt-record=_llm-code._tcp.dev.local,"provider=mock"
txt-record=_llm-code._tcp.dev.local,"model=mock-code-model"
txt-record=_llm-code._tcp.dev.local,"environment=development"

# =============================================================================
# IMAGE GENERATION ENDPOINTS
# =============================================================================

srv-host=_llm-image-gen._tcp.dev.local,localhost,3004,10,100

txt-record=_llm-image-gen._tcp.dev.local,"path=/v1/images/generations"
txt-record=_llm-image-gen._tcp.dev.local,"provider=mock"
txt-record=_llm-image-gen._tcp.dev.local,"environment=development"

# =============================================================================
# AUDIO/SPEECH ENDPOINTS
# =============================================================================

srv-host=_llm-audio._tcp.dev.local,localhost,3005,10,100

txt-record=_llm-audio._tcp.dev.local,"capabilities=transcription,tts"
txt-record=_llm-audio._tcp.dev.local,"provider=mock"
txt-record=_llm-audio._tcp.dev.local,"environment=development"

# =============================================================================
# POLICY-BASED SUBDOMAINS (for testing different tiers)
# =============================================================================

# Fast/cheap tier (same endpoint for dev)
srv-host=_llm-chat._tcp.fast.dev.local,localhost,3000,10,100
txt-record=_llm-chat._tcp.fast.dev.local,"tier=fast"
txt-record=_llm-chat._tcp.fast.dev.local,"cost=low"

# Smart/premium tier (same endpoint for dev, different metadata)
srv-host=_llm-chat._tcp.smart.dev.local,localhost,3000,10,100
txt-record=_llm-chat._tcp.smart.dev.local,"tier=premium"
txt-record=_llm-chat._tcp.smart.dev.local,"model=claude-opus-5"

# PII-compliant tier
srv-host=_llm-chat._tcp.pii.dev.local,localhost,3000,10,100
txt-record=_llm-chat._tcp.pii.dev.local,"compliance=soc2,hipaa"
txt-record=_llm-chat._tcp.pii.dev.local,"data-residency=local"

# =============================================================================
# ADDITIONAL A RECORDS (if needed)
# =============================================================================

# If using non-localhost targets
# address=/dev-llm.dev.local/192.168.1.100
# address=/staging-llm.dev.local/192.168.1.200

# =============================================================================
# MULTIPLE ENDPOINTS WITH PRIORITIES (Production-like testing)
# =============================================================================

# Example: Simulate load balancing and failover
# srv-host=_llm-chat._tcp.prod.local,llm-primary.local,8080,10,70
# srv-host=_llm-chat._tcp.prod.local,llm-secondary.local,8080,10,30
# srv-host=_llm-chat._tcp.prod.local,llm-backup.local,8080,20,100
#
# address=/llm-primary.local/192.168.1.101
# address=/llm-secondary.local/192.168.1.102
# address=/llm-backup.local/192.168.1.103

# =============================================================================
# DOCKER COMPOSE INTEGRATION
# =============================================================================

# If running LLM services in Docker Compose
# srv-host=_llm-chat._tcp.dev.local,llm-chat,3000,10,100
# srv-host=_llm-embedding._tcp.dev.local,llm-embedding,3001,10,100
#
# Note: Docker container names resolve automatically if using Docker's DNS
# Or use docker-compose network names:
# address=/llm-chat/172.20.0.2
# address=/llm-embedding/172.20.0.3

# =============================================================================
# NOTES
# =============================================================================
#
# Testing:
#   dig @localhost -p 5353 SRV _llm-chat._tcp.dev.local
#   dig @localhost -p 5353 TXT _llm-chat._tcp.dev.local
#
# Start mock servers:
#   python mock_llm_server.py --port 3000  # Chat
#   python mock_llm_server.py --port 3001  # Embeddings
#
# Or use docker-compose:
#   docker-compose up -d
#
# Client library usage:
#   See examples/clients/ for Python/Go/Rust implementations
