# PowerDNS Authoritative Server Configuration
# LLM Discovery with Subnet-based Routing

# =============================================================================
# BACKEND CONFIGURATION - MySQL/MariaDB
# =============================================================================

# Use MySQL backend
launch=gmysql

# Database connection
gmysql-host=127.0.0.1
gmysql-port=3306
gmysql-dbname=pdns
gmysql-user=pdns
gmysql-password=CHANGE_ME_DB_PASSWORD
gmysql-dnssec=no

# Connection pooling
gmysql-timeout=10

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

# Daemon mode
daemon=yes
guardian=yes

# Run as user/group
setuid=pdns
setgid=pdns

# Listening interfaces
local-address=0.0.0.0
local-port=53

# =============================================================================
# AUTHORITATIVE SERVER SETTINGS
# =============================================================================

# This is an authoritative-only server
master=yes
slave=no

# (An authoritative server does not recurse by design; there is no
# "recursor" option here - run the separate PowerDNS Recursor if you
# need recursion.)

# Default TTL
default-ttl=300

# SOA values
default-soa-content=ns1.@ admin.@ 0 3600 1800 604800 300

# =============================================================================
# LUA SCRIPTING FOR SUBNET-BASED ROUTING
# =============================================================================

# Pre-query hook: intercepts queries before normal resolution so the
# Lua script can build subnet-specific SRV answers.
#
# NOTE: lua-prequery-script is documented by PowerDNS as an internal
# feature with an unstable API. It works well for demos like this one,
# but pin your PowerDNS version when using it in earnest, and prefer
# LUA records (https://doc.powerdns.com/authoritative/lua-records/)
# for new deployments where possible.
lua-prequery-script=/etc/powerdns/subnet-router.lua

# Honor EDNS Client Subnet so the Lua script can also act on the
# original client address when queries arrive via forwarding resolvers
use-incoming-edns-subnet=yes

# =============================================================================
# API CONFIGURATION
# =============================================================================

# Enable API for programmatic management
api=yes
api-key=CHANGE_ME_API_KEY

# Web server for API (loopback only)
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1,::1

# CAUTION: api-readonly=no allows zone/record modification through the
# API. Keep the webserver loopback-bound (above) and use a strong,
# unique api-key if you enable this anywhere shared.
api-readonly=no

# =============================================================================
# LOGGING
# =============================================================================

# Log level (0=emergency, 9=debug)
loglevel=4

# Query logging is DISABLED by default: it writes every client's
# queries to disk, which is a privacy and disk-usage consideration.
# Uncomment for debugging.
# log-dns-queries=yes
# log-dns-details=yes
# query-logging=yes

# Syslog facility
logging-facility=0

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# Distribution threads (use cores - 1)
distributor-threads=3

# Receiver threads
receiver-threads=1

# Cache sizes
query-cache-ttl=20
negquery-cache-ttl=60

# Packet cache
cache-ttl=20

# =============================================================================
# SECURITY
# =============================================================================

# Version hiding
version-string=PowerDNS LLM Discovery

# Disable version queries
disable-syslog=no
query-logging=yes

# Zone transfers (disable by default)
disable-axfr=yes
allow-axfr-ips=

# DNSSEC (disabled for this example, enable in production)
# dnssec=yes
# dnssec-negative-caching=yes

# =============================================================================
# MONITORING
# =============================================================================

# Enable statistics
# webserver-print-arguments=yes

# Carbon/Graphite metrics (optional)
# carbon-server=127.0.0.1
# carbon-interval=30

# =============================================================================
# ADVANCED OPTIONS
# =============================================================================

# Disable out-of-zone data
out-of-zone-additional-processing=no

# Maximum queue length
max-queue-length=5000

# Overload protection
overload-queue-length=0

# =============================================================================
# TESTING/DEVELOPMENT OPTIONS
# =============================================================================

# For development: shorter cache TTLs
# query-cache-ttl=5
# cache-ttl=5

# Verbose logging for debugging
# loglevel=9
# log-dns-queries=yes
# trace=yes

# =============================================================================
# NOTES
# =============================================================================
#
# After changing this file:
#   sudo systemctl restart pdns
#
# To reload zones without restart:
#   sudo pdns_control reload
#
# To purge specific zone cache:
#   sudo pdns_control purge corp.example.com
#
# To view statistics:
#   sudo pdns_control show '*'
#
# To test configuration:
#   pdns_server --config-dir=/etc/powerdns --daemon=no
